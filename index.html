<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mutaba'ah Yaumiyah - Tracker Ibadah</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen py-8 px-4 font-sans">
  <div class="max-w-4xl mx-auto space-y-6">

    <!-- Header & Login Area -->
    <header class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-5">
      <div>
        <h1 class="text-2xl font-bold text-emerald-400">Mutaba'ah Yaumiyah</h1>
        <p class="text-xs text-slate-400">Tracker Ibadah & Muhasabah Harian (Cloud Sync)</p>
      </div>

      <div id="authSection">
        <button id="loginBtn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-xl text-xs font-semibold flex items-center gap-2 transition active:scale-95 shadow-md shadow-emerald-900/30">
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12.24 10.285V13.4h6.887C18.2 16.11 15.645 18 12.24 18c-3.315 0-6-2.685-6-6s2.685-6 6-6c1.47 0 2.815.53 3.865 1.405l2.38-2.38C16.89 3.51 14.7 2.6 12.24 2.6 7.03 2.6 2.8 6.83 2.8 12s4.23 9.4 9.44 9.4c5.44 0 9.06-3.825 9.06-9.22 0-.62-.065-1.22-.185-1.895H12.24z"/></svg>
          <span>Masuk dengan Google</span>
        </button>

        <div id="userProfile" class="hidden flex items-center gap-3 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl">
          <img id="userAvatar" class="w-8 h-8 rounded-full border border-emerald-400 object-cover" src="" alt="Avatar">
          <div class="text-left text-xs">
            <p id="userName" class="font-medium text-slate-200 leading-tight"></p>
            <button id="logoutBtn" class="text-rose-400 hover:underline text-[11px]">Keluar</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Navigasi Tanggal -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-4 shadow-lg">
      <div class="flex items-center gap-2">
        <button id="prevDayBtn" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs transition">◀ Kemarin</button>
        <button id="todayBtn" class="px-3 py-1.5 bg-emerald-700/70 hover:bg-emerald-600 rounded-lg text-xs font-medium transition">Hari Ini</button>
        <button id="nextDayBtn" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs transition">Besok ▶</button>
      </div>

      <div class="flex items-center gap-3">
        <span id="dateTag" class="px-2.5 py-1 text-xs font-semibold rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">Hari Ini</span>
        <input type="date" id="datePicker" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
      </div>
    </section>

    <!-- Konten Utama: 2 Kolom di Desktop -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

      <!-- Kolom Kiri: Form Checklist (Lebar 2 Kolom) -->
      <div class="lg:col-span-2 space-y-4">
        
        <!-- Progress Bar Tanggal Aktif -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow">
          <div class="flex justify-between items-center mb-2 text-xs font-medium">
            <span class="text-slate-300">Capaian Tanggal Ini</span>
            <span class="text-emerald-400 font-bold" id="progressText">0% (0/0)</span>
          </div>
          <div class="w-full bg-slate-800 rounded-full h-2.5 overflow-hidden">
            <div id="progressBar" class="bg-emerald-500 h-full rounded-full transition-all duration-300 w-0"></div>
          </div>
        </div>

        <!-- Group Checklist -->
        <main class="space-y-4">
          
          <!-- 1. Sholat Wajib -->
          <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-4">
            <h2 class="text-sm font-semibold text-emerald-400 mb-3 flex items-center gap-2">
              <span>🕌</span> Sholat Wajib 5 Waktu
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              <label class="item-card"><input type="checkbox" id="sholat_subuh" class="habit-check"><span>Subuh Tepat Waktu</span></label>
              <label class="item-card"><input type="checkbox" id="sholat_dzuhur" class="habit-check"><span>Dzuhur Tepat Waktu</span></label>
              <label class="item-card"><input type="checkbox" id="sholat_ashar" class="habit-check"><span>Ashar Tepat Waktu</span></label>
              <label class="item-card"><input type="checkbox" id="sholat_maghrib" class="habit-check"><span>Maghrib Tepat Waktu</span></label>
              <label class="item-card"><input type="checkbox" id="sholat_isya" class="habit-check"><span>Isya Tepat Waktu</span></label>
            </div>
          </div>

          <!-- 2. Sholat Sunnah -->
          <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-4">
            <h2 class="text-sm font-semibold text-emerald-400 mb-3 flex items-center gap-2">
              <span>✨</span> Sholat Sunnah
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              <label class="item-card"><input type="checkbox" id="sunnah_tahajjud" class="habit-check"><span>Tahajjud / Qiyamul Lail</span></label>
              <label class="item-card"><input type="checkbox" id="sunnah_dhuha" class="habit-check"><span>Sholat Dhuha</span></label>
              <label class="item-card"><input type="checkbox" id="sunnah_rawatib" class="habit-check"><span>Sholat Rawatib</span></label>
              <label class="item-card"><input type="checkbox" id="sunnah_witir" class="habit-check"><span>Sholat Witir</span></label>
            </div>
          </div>

          <!-- 3. Al-Qur'an & Kajian -->
          <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-4">
            <h2 class="text-sm font-semibold text-emerald-400 mb-3 flex items-center gap-2">
              <span>📖</span> Al-Qur'an & Pembelajaran
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              <label class="item-card"><input type="checkbox" id="quran_tilawah" class="habit-check"><span>Tilawah / One Day One Juz</span></label>
              <label class="item-card"><input type="checkbox" id="quran_tadabbur" class="habit-check"><span>Tadabbur Terjemah / Tafsir</span></label>
              <label class="item-card"><input type="checkbox" id="ngaji_kajian" class="habit-check"><span>Ngaji / Mengikuti Kajian</span></label>
              <label class="item-card"><input type="checkbox" id="dzikir_pagi_petang" class="habit-check"><span>Dzikir Pagi & Petang</span></label>
            </div>
          </div>

          <!-- 4. Muhasabah (Tidak Maksiat) -->
          <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-4">
            <h2 class="text-sm font-semibold text-amber-400 mb-3 flex items-center gap-2">
              <span>🛡️</span> Muhasabah & Menjaga Diri
            </h2>
            <div class="grid grid-cols-1 gap-2">
              <label class="item-card border-amber-500/20"><input type="checkbox" id="maksiat_mata" class="habit-check"><span>Ghadhul Bashar (Menjaga Pandangan)</span></label>
              <label class="item-card border-amber-500/20"><input type="checkbox" id="maksiat_lisan" class="habit-check"><span>Menjaga Lisan (Bebas Ghibah & Dusta)</span></label>
              <label class="item-card border-amber-500/20"><input type="checkbox" id="maksiat_gadget" class="habit-check"><span>Bebas Konsumsi Konten Unfaedah / Maksiat</span></label>
              <label class="item-card border-amber-500/20"><input type="checkbox" id="istighfar_taubat" class="habit-check"><span>Istighfar & Muhasabah Diri</span></label>
            </div>
          </div>

        </main>
      </div>

      <!-- Kolom Kanan: Riwayat Laporan Harian -->
      <aside class="space-y-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow">
          <h2 class="text-sm font-semibold text-slate-200 mb-3 flex items-center gap-2">
            <span>📊</span> Riwayat Laporan Harian
          </h2>
          <div id="historyList" class="space-y-2 max-h-[500px] overflow-y-auto pr-1 text-xs">
            <!-- Riwayat dirender di sini via JS -->
          </div>
        </div>
      </aside>

    </div>
  </div>

  <style>
    .item-card {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.65rem 0.85rem;
      background-color: rgba(30, 41, 59, 0.45);
      border: 1px solid rgba(51, 65, 85, 0.55);
      border-radius: 0.6rem;
      cursor: pointer;
      font-size: 0.825rem;
      user-select: none;
      transition: all 0.2s;
    }
    .item-card:hover {
      background-color: rgba(51, 65, 85, 0.75);
    }
    .item-card input[type="checkbox"] {
      width: 1.15rem;
      height: 1.15rem;
      border-radius: 0.25rem;
      accent-color: #10b981;
      cursor: pointer;
    }
    .item-card.completed {
      background-color: rgba(6, 78, 59, 0.25);
      border-color: rgba(16, 185, 129, 0.35);
      color: #94a3b8;
      text-decoration: line-through;
    }
  </style>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Konfigurasi Firebase dari Project Anda
    const firebaseConfig = {
      apiKey: "AIzaSyCpMgLDT33wkmCsLmiMI9tRtXZx3OIxhKs",
      authDomain: "catatan-b55c1.firebaseapp.com",
      projectId: "catatan-b55c1",
      storageBucket: "catatan-b55c1.firebasestorage.app",
      messagingSenderId: "162246812457",
      appId: "1:162246812457:web:b26fadaeaaf6e066fa0d38",
      measurementId: "G-KWSHM37ZST"
    };

    // Inisialisasi Firebase & Layanan
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let selectedDate = new Date();
    let userRecords = {};

    const checkboxes = document.querySelectorAll('.habit-check');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const datePicker = document.getElementById('datePicker');
    const dateTag = document.getElementById('dateTag');
    const historyList = document.getElementById('historyList');

    function formatDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    // Pemantau Status Login (Auth Observer)
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        document.getElementById('loginBtn').classList.add('hidden');
        document.getElementById('userProfile').classList.remove('hidden');
        document.getElementById('userName').innerText = user.displayName;
        document.getElementById('userAvatar').src = user.photoURL || 'https://via.placeholder.com/40';
        
        // Dengarkan pembaruan real-time dari Firestore
        const docRef = doc(db, "mutabaah_users", user.uid);
        onSnapshot(docRef, (docSnap) => {
          if (docSnap.exists()) {
            userRecords = docSnap.data().records || {};
          } else {
            userRecords = {};
          }
          updateUI();
        });
      } else {
        document.getElementById('loginBtn').classList.remove('hidden');
        document.getElementById('userProfile').classList.add('hidden');
        // Fallback ke localStorage jika mode offline / belum login
        userRecords = JSON.parse(localStorage.getItem('mutabaah_records') || '{}');
        updateUI();
      }
    });

    // Simpan Checklist (Firestore jika login, localStorage jika tidak)
    async function handleCheckChange() {
      const dateKey = formatDateKey(selectedDate);
      const dayData = {};
      let count = 0;

      checkboxes.forEach(cb => {
        if (cb.checked) {
          dayData[cb.id] = true;
          count++;
        }
      });

      if (count > 0) {
        userRecords[dateKey] = dayData;
      } else {
        delete userRecords[dateKey];
      }

      if (currentUser) {
        await setDoc(doc(db, "mutabaah_users", currentUser.uid), { records: userRecords }, { merge: true });
      } else {
        localStorage.setItem('mutabaah_records', JSON.stringify(userRecords));
        updateUI();
      }
    }

    function updateUI() {
      const selectedKey = formatDateKey(selectedDate);
      datePicker.value = selectedKey;

      const today = new Date();
      const todayKey = formatDateKey(today);

      const yesterday = new Date(today);
      yesterday.setDate(today.getDate() - 1);
      const yesterdayKey = formatDateKey(yesterday);

      const tomorrow = new Date(today);
      tomorrow.setDate(today.getDate() + 1);
      const tomorrowKey = formatDateKey(tomorrow);

      if (selectedKey === todayKey) {
        dateTag.innerText = "Hari Ini";
        dateTag.className = "px-2.5 py-1 text-xs font-semibold rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
      } else if (selectedKey === yesterdayKey) {
        dateTag.innerText = "Kemarin";
        dateTag.className = "px-2.5 py-1 text-xs font-semibold rounded-full bg-slate-700 text-slate-300 border border-slate-600";
      } else if (selectedKey === tomorrowKey) {
        dateTag.innerText = "Besok";
        dateTag.className = "px-2.5 py-1 text-xs font-semibold rounded-full bg-blue-500/20 text-blue-300 border border-blue-500/30";
      } else {
        const d = new Date(selectedDate);
        dateTag.innerText = d.toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' });
        dateTag.className = "px-2.5 py-1 text-xs font-semibold rounded-full bg-slate-800 text-slate-400 border border-slate-700";
      }

      // Checkbox state
      const dayData = userRecords[selectedKey] || {};
      let count = 0;

      checkboxes.forEach(cb => {
        const checked = !!dayData[cb.id];
        cb.checked = checked;
        cb.closest('label').classList.toggle('completed', checked);
        if (checked) count++;
      });

      // Progress bar
      const total = checkboxes.length;
      const pct = Math.round((count / total) * 100);
      progressBar.style.width = pct + '%';
      progressText.innerText = `${pct}% (${count}/${total})`;

      renderHistory();
    }

    function renderHistory() {
      const total = checkboxes.length;
      const keys = Object.keys(userRecords).sort().reverse();
      historyList.innerHTML = '';

      if (keys.length === 0) {
        historyList.innerHTML = `<div class="text-slate-500 text-center py-6 text-xs">Belum ada catatan ibadah tersimpan.</div>`;
        return;
      }

      const todayKey = formatDateKey(new Date());

      keys.forEach(key => {
        const count = Object.keys(userRecords[key] || {}).length;
        const pct = Math.round((count / total) * 100);
        const isCurrentSelected = key === formatDateKey(selectedDate);

        const item = document.createElement('div');
        item.className = `p-2.5 rounded-xl border flex items-center justify-between cursor-pointer transition ${
          isCurrentSelected 
            ? 'bg-emerald-950/50 border-emerald-500/60 shadow-sm' 
            : 'bg-slate-800/40 border-slate-700/50 hover:bg-slate-800'
        }`;

        item.onclick = () => {
          selectedDate = new Date(key + 'T00:00:00');
          updateUI();
        };

        item.innerHTML = `
          <div>
            <div class="font-medium text-slate-200 flex items-center gap-1.5">
              <span>${key}</span>
              ${key === todayKey ? '<span class="text-[10px] px-1.5 py-0.2 rounded bg-emerald-500/20 text-emerald-400">Hari Ini</span>' : ''}
            </div>
            <div class="text-[11px] text-slate-400 mt-0.5">${count} dari ${total} selesai</div>
          </div>
          <span class="font-bold ${pct === 100 ? 'text-emerald-400' : pct >= 50 ? 'text-amber-400' : 'text-slate-400'}">${pct}%</span>
        `;
        historyList.appendChild(item);
      });
    }

    // Event Bindings
    document.getElementById('loginBtn').onclick = () => signInWithPopup(auth, provider);
    document.getElementById('logoutBtn').onclick = () => signOut(auth);
    checkboxes.forEach(cb => cb.addEventListener('change', handleCheckChange));

    datePicker.addEventListener('change', (e) => {
      if (e.target.value) {
        selectedDate = new Date(e.target.value + 'T00:00:00');
        updateUI();
      }
    });

    document.getElementById('prevDayBtn').onclick = () => { selectedDate.setDate(selectedDate.getDate() - 1); updateUI(); };
    document.getElementById('nextDayBtn').onclick = () => { selectedDate.setDate(selectedDate.getDate() + 1); updateUI(); };
    document.getElementById('todayBtn').onclick = () => { selectedDate = new Date(); updateUI(); };

    // Load awal
    updateUI();
  </script>
</body>
</html>
